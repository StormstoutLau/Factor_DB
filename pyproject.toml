[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-db"
version = "1.0.0"
description = "Factor_DB - 因子数据库模块（DuckDB）"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "duckdb>=0.10.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "akshare>=1.14.0",
]

[project.scripts]
factor-db = "Factor_DB.cli:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["Factor_DB*"]
